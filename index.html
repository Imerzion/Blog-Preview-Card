<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./style/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="blog-card">
        <div class="card-hero">
          <img class="card-image" src="./assets/images/illustration-article.svg" alt="Blog Hero Image" />
        </div>
        <div class="card-content">
          <span class="card-badge">Learning</span>
          <p class="card-date">Published 21 Dec 2023</p>
          <h1 class="card-title">HTML & CSS foundations</h1>
          <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="card-footer">
          <img class="card-avatar" src="./assets/images/image-avatar.webp" alt="Blog Author Image" />
          <p class="card-author">Greg Hooper</p>
        </div>
      </article>
    </main>

    <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="https://github.com/Imerzion/">Imerzion</a>.</footer>
  </body>
</html>
